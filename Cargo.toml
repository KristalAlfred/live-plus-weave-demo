[package]
name = "greenroom"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The wire contract comes from open-weave itself, so the payloads this service
# builds cannot drift from the ones the control plane accepts.
weave-core = { git = "https://github.com/KristalAlfred/open-weave" }

anyhow = "1"
axum = "0.8"
bytes = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
